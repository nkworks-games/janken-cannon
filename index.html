<script>
(() => {
'use strict';
// ================= 基本設定（数値はここで調整） =================
const W = 360;                 // 論理的な横幅（縦は画面に合わせて可変）
// ↓ゲームバランスの数値（ここを変えれば調整できます）
const T = Object.assign({
  hpMax: 100, dmg: 10,          // HP・1発のダメージ（自分のHPは次の戦いでも回復しない）
  ammoMax: 10, pRegen: 0.18,    // 自分の弾：最大数・何秒で1発回復するか
  pSpeed: 200,                  // 自分の手の速さ(px/秒)
  cRegen0: 0.22, cRegenK: 0.006, cRegenMin: 0.15,    // CPUの弾の回復（Lv1の値・Lvごとの変化・下限）
  cIdle0: 0.3, cIdleK: 0.01, cIdleMin: 0.2,           // CPUが攻める間隔
  cCounter0: 0.1, cCounterK: 0.07, cCounterMax: 0.85, // CPUが勝ち手を返す確率
  cSpeed0: 155, cSpeedK: 4, cSpeedMax: 215,           // CPUの手の速さ
  bossHp: 100, bossHpK: 10,     // ボスのHP（1体目・ボスごとの増加）
  bRegen: 0.18, bIdle: 0.3,     // ボスの弾の回復・攻める間隔（1体目）
  bStep: 0.015,                 // ボスが1体ごとに速くなる量
  bVolEvery: 4.5, bVolN: 3      // ボスの一斉発射：何秒ごと・1門あたり何連発
}, window.__TUNE || {});
const HP_MAX = T.hpMax, DMG = T.dmg, AMMO_MAX = T.ammoMax, P_REGEN = T.pRegen, P_SPEED = T.pSpeed;
const R = 15;                  // 手の当たり判定の半径
const SWING_AMP = 60 * Math.PI / 180;  // 首振りの角度（左右60°）
const P_PERIOD = 2.4, E_PERIOD = 2.75; // 首振り1往復の秒数
const MUZZLE = 46;
const INK = '#2b2b2b', BLUE = '#2f55d4', RED = '#d8412f', PAPER = '#fbf8ef', GRAY = '#8a8a8a';
const FONT = "'Yomogi','Hiragino Maru Gothic ProN','Rounded Mplus 1c','Meiryo',sans-serif";
const NAMES = ['グー', 'チョキ', 'パー'];
const beats = (a, b) => (b - a + 3) % 3 === 1;   // aがbに勝つ
const counterOf = t => (t + 2) % 3;               // tに勝つ手

// CPUの強さ（Lv = 何戦目か）
const isBoss = st => st % 3 === 0;   // 3・6・9…戦目はボス
function makeCPU(lv) {
  const c = {
    lv, ammo: AMMO_MAX, regen: 0,
    regenInt: Math.max(T.cRegenMin, T.cRegen0 - T.cRegenK * (lv - 1)),     // 弾の回復間隔
    speed: Math.min(T.cSpeedMax, T.cSpeed0 + T.cSpeedK * (lv - 1)),        // 手の速さ
    counterP: Math.min(T.cCounterMax, T.cCounter0 + T.cCounterK * (lv - 1)), // 飛んでくる手に勝ち手を返す確率
    react: Math.max(0.15, 0.6 - 0.05 * (lv - 1)),                          // 反応の速さ(秒)
    idle: Math.max(T.cIdleMin, T.cIdle0 - T.cIdleK * (lv - 1)),            // 攻める間隔
    reserve: lv >= 7 ? 3 : lv >= 4 ? 2 : 0,                                // 守り用に残す弾
    burstP: Math.min(0.55, 0.3 + 0.03 * (lv - 1)),                         // 同じ手を連射する確率
    burstLeft: 0, burstT: 0, burstType: 0,
    idleT: 0.2, tol: 20, ammoMax: AMMO_MAX, hpMax: HP_MAX, boss: false
  };
  if (isBoss(lv)) {
    const bn = lv / 3; // 何体目のボスか
    Object.assign(c, {
      boss: true, bn, ammoMax: 24, ammo: 24, hpMax: T.bossHp + T.bossHpK * (bn - 1),
      regenInt: Math.max(0.08, T.bRegen - T.bStep * (bn - 1)), idle: Math.max(0.12, T.bIdle - T.bStep * 1.5 * (bn - 1)),
      volEvery: Math.max(2.5, T.bVolEvery - 0.25 * (bn - 1)), volN: T.bVolN + Math.floor((bn - 1) / 2), volT: 2.2, volType: 0, vq: []
    });
  }
  return c;
}
function makeCannons(boss) {
  return (boss
    ? [{ x: 70, ph: 0.4, per: 2.2 }, { x: W / 2, ph: 2.2, per: 2.9 }, { x: W - 70, ph: 4.1, per: 2.5 }]
    : [{ x: W / 2, ph: 1.9, per: E_PERIOD }]).map(c => Object.assign(c, { ang: 0, rec: 0, sc: boss ? 1.2 : 1 }));
}

// ================= 画面サイズ =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let H = 700, S = 1, DPR = 1, OX = 0, OY = 0;
const L = {};
function layout() {
  L.eLine = 46; L.pLine = H - 52;
  L.E = { x: W / 2, y: L.eLine }; L.P = { x: W / 2, y: L.pLine };
  L.btnX = 316; L.btnR = 25;
  L.btn = [{ t: 0, y: L.pLine - 158 }, { t: 1, y: L.pLine - 97 }, { t: 2, y: L.pLine - 36 }];
  L.hpTop = 22; L.hpBot = H - 24;
  L.mute = { x: W - 20, y: 22 };
}
function resize() {
  const sa = document.getElementById('sa');
  const st = parseFloat(getComputedStyle(sa).paddingTop) || 0, sb = parseFloat(getComputedStyle(sa).paddingBottom) || 0;
  const vw = window.innerWidth, vh = window.innerHeight - st - sb;
  S = Math.min(vw / W, vh / 600);
  H = Math.min(vh / S, 840);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = W * S, ch = H * S;
  OX = (vw - cw) / 2; OY = st + (vh - ch) / 2;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = OX + 'px'; cv.style.top = OY + 'px';
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  layout();
}
window.addEventListener('resize', resize);
resize();

// ================= 保存 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

// ================= サウンド =================
let AC = null, NOISE = null, muted = store.get('jkc_mute', false);
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const b = AC.createBuffer(1, AC.sampleRate * 0.4, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      NOISE = b;
      const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { }
}
function tone(f1, f2, dur, type = 'triangle', vol = 0.15, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1200, delay = 0) {
  if (!AC || muted || !NOISE) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur);
}
const SFX = {
  shot() { tone(640, 300, 0.09, 'square', 0.05); noise(0.05, 0.06, 2600); },
  eshot() { tone(420, 220, 0.08, 'square', 0.025); },
  clash() { tone(880, 1400, 0.07, 'triangle', 0.1); noise(0.07, 0.08, 3200); },
  tie() { noise(0.12, 0.1, 900); tone(300, 200, 0.1, 'sine', 0.08); },
  hit() { noise(0.25, 0.3, 700); tone(170, 50, 0.25, 'sine', 0.3); },
  warn() { tone(990, 990, 0.07, 'square', 0.05); tone(990, 990, 0.07, 'square', 0.05, 0.14); },
  empty() { tone(160, 140, 0.06, 'square', 0.04); },
  jan(i) { const f = [523, 587, 880][i]; tone(f, f, i === 2 ? 0.22 : 0.12, 'triangle', 0.13); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.13, i * 0.1)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, f * 0.97, 0.26, 'triangle', 0.13, i * 0.18)); }
};

// ================= 落書き風の線（プルプル動く） =================
let boil = 0;
function hsh(a, b, c) {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1442695041)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16;
  return ((x >>> 0) / 4294967295) * 2 - 1;
}
const jit = (id, k, amp) => hsh(id, k, boil) * amp;
function wline(x1, y1, x2, y2, id, amp = 1) {
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, n = Math.max(1, Math.round(len / 60));
  const nx = -(y2 - y1) / len, ny = (x2 - x1) / len, p = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, o = jit(id, i, amp * 1.3);
    p.push([x1 + (x2 - x1) * f + nx * o + jit(id, i + 50, amp * 0.4), y1 + (y2 - y1) * f + ny * o + jit(id, i + 90, amp * 0.4)]);
  }
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  if (n === 1) {
    const o = jit(id, 77, amp);
    ctx.quadraticCurveTo((p[0][0] + p[1][0]) / 2 + nx * o, (p[0][1] + p[1][1]) / 2 + ny * o, p[1][0], p[1][1]);
  } else {
    for (let i = 1; i < n; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
    ctx.lineTo(p[n][0], p[n][1]);
  }
  ctx.stroke();
}
function wcirc(x, y, rx, ry, id, amp = 0.8) {
  const n = 16, p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, k = 1 + jit(id, i, amp) / Math.max(rx, 1);
    p.push([x + Math.cos(a) * rx * k, y + Math.sin(a) * ry * k]);
  }
  ctx.beginPath(); ctx.moveTo((p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  ctx.closePath();
}
function wrect(x, y, w, h, id, amp = 0.8) {
  wline(x - 1.5, y, x + w + 1.5, y, id, amp); wline(x + w, y - 1.5, x + w, y + h + 1.5, id + 1, amp);
  wline(x + w + 1.5, y + h, x - 1.5, y + h, id + 2, amp); wline(x, y + h + 1.5, x, y - 1.5, id + 3, amp);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, col = INK, align = 'center', alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}

// ================= 手の形（指先が上向き） =================
// 'r'=角丸の四角 [x,y,w,h,r] / 'c'=太い線 [x1,y1,x2,y2,半径] / det=しわの線
const HANDS = [
  { // グー
    body: [['r', -11, -8, 22, 20, 8], ['c', -7, -8.6, -7, -8.4, 3.3], ['c', -2.4, -9.7, -2.4, -9.5, 3.3], ['c', 2.4, -9.7, 2.4, -9.5, 3.3], ['c', 7, -8.6, 7, -8.4, 3.3]],
    det: [[-4.7, -9, -4.7, -4], [0, -10, 0, -4], [4.7, -9, 4.7, -4], [-10.5, 1, -3, -2, 4.5, 2], [4.5, 2, 1, 5, -3, 5.5]]
  },
  { // チョキ
    body: [['r', -10, -1, 20, 15, 7], ['c', -3.5, 1, -7.8, -18, 2.9], ['c', 3, 1, 7, -18.5, 2.9]],
    det: [[-9.5, 6, -4, 3.5, 0, 6.5], [1.5, 3.5, 5.5, 0.5, 9.5, 3.5], [2, 7.5, 6, 5, 9.5, 7.5]]
  },
  { // パー
    body: [['r', -10, -3, 20, 17, 7], ['c', -6.5, -1, -8.8, -15, 2.8], ['c', -2, -2, -2.3, -18, 2.8], ['c', 2.5, -2, 3.9, -16.5, 2.8], ['c', 7, 0, 9.8, -12, 2.6], ['c', -8.5, 7, -15.5, -0.5, 3]],
    det: [[-5, 7.5, 0, 10, 5, 6.5]]
  }
];
function drawHand(t, x, y, rot, sc, col, alpha = 1, id = 0) {
  const hd = HANDS[t];
  ctx.save(); ctx.translate(x + jit(id, 201, 0.5), y + jit(id, 202, 0.5)); ctx.rotate(rot + jit(id, 203, 0.04)); ctx.scale(sc, sc);
  ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let pass = 0; pass < 2; pass++) {
    const c = pass === 0 ? col : '#fff';
    ctx.strokeStyle = c; ctx.fillStyle = c;
    for (const p of hd.body) {
      if (p[0] === 'r') { rr(p[1], p[2], p[3], p[4], p[5]); if (pass === 0) { ctx.lineWidth = 5; ctx.stroke(); } ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(p[1], p[2]); ctx.lineTo(p[3], p[4]); ctx.lineWidth = p[5] * 2 + (pass === 0 ? 5 : 0); ctx.stroke(); }
    }
  }
  ctx.strokeStyle = col; ctx.lineWidth = 1.8;
  for (const d of hd.det) {
    ctx.beginPath(); ctx.moveTo(d[0], d[1]);
    if (d.length === 4) ctx.lineTo(d[2], d[3]); else ctx.quadraticCurveTo(d[2], d[3], d[4], d[5]);
    ctx.stroke();
  }
  ctx.restore();
}

// ================= ゲームの状態 =================
const G = {
  state: 'title', stateT: 0, t: 0, streak: 0, best: store.get('jkc_best', 0), newBest: false,
  hpP: HP_MAX, hpE: HP_MAX, hpPs: HP_MAX, hpEs: HP_MAX, ammo: AMMO_MAX, regen: 0,
  hands: [], fx: [], shake: 0, flashE: 0, flashP: 0, shots: 0, press: [0, 0, 0], emptyCD: 0,
  P: { ang: 0, rec: 0, ph: 0 }, Es: makeCannons(false), swingT: 0, introStep: 0, cpu: null,
  hpEMax: HP_MAX, stat: { w: 0, l: 0, d: 0 }, warn: 0
};
let hid = 0;
function setState(s) { G.state = s; G.stateT = 0; }
function startRun() { G.streak = 0; G.newBest = false; G.hpP = G.hpPs = HP_MAX; startMatch(); }
function startMatch() { // 自分のHPはそのまま（回復しない）、相手のHPだけ満タンに戻す
  G.cpu = makeCPU(G.streak + 1); G.Es = makeCannons(G.cpu.boss);
  G.hpEMax = G.hpE = G.hpEs = G.cpu.hpMax; G.hands = []; G.fx = []; G.stat = { w: 0, l: 0, d: 0 }; G.warn = 0;
  G.ammo = AMMO_MAX; G.regen = 0; G.introStep = 0;
  setState('intro');
}
function spawn(side, t, x, y, vx, vy) {
  G.hands.push({ id: ++hid, side, t, x, y, vx, vy, alive: true, kills: 0, born: G.t, plan: null });
}
function playerFire(t) {
  if (G.state !== 'play') return;
  if (G.ammo < 1) {
    G.press[t] = 0.5;
    if (G.emptyCD <= 0) { fxText(70, L.pLine - 66, 'たまぎれ！', GRAY, 15, 0.6); SFX.empty(); G.emptyCD = 0.4; }
    return;
  }
  G.ammo--;
  const a = G.P.ang, dx = Math.sin(a), dy = -Math.cos(a);
  spawn('p', t, L.P.x + dx * MUZZLE, L.P.y + dy * MUZZLE, dx * P_SPEED, dy * P_SPEED);
  G.P.rec = 1; G.press[t] = 1; G.shots++; SFX.shot();
}
function cpuFire(t, cn, free) {
  const c = G.cpu;
  if (!free) { if (c.ammo < 1) return false; c.ammo--; }
  cn = cn || G.Es[Math.random() * G.Es.length | 0];
  const a = cn.ang, dx = Math.sin(a), dy = Math.cos(a), m = MUZZLE * cn.sc;
  spawn('e', t, cn.x + dx * m, L.eLine + dy * m, dx * c.speed, dy * c.speed);
  cn.rec = 1; SFX.eshot(); return true;
}
function fold(x) { // 壁で跳ね返った後の位置
  const a = R, b = W - R, len = b - a;
  let u = (x - a) % (2 * len); if (u < 0) u += 2 * len;
  return a + (u <= len ? u : 2 * len - u);
}
function cpuAimed(h, cn) {
  const c = G.cpu, a = cn.ang, dx = Math.sin(a), dy = Math.cos(a), m = MUZZLE * cn.sc;
  const mx = cn.x + dx * m, my = L.eLine + dy * m;
  const gap = h.y - my; if (gap < 40) return false;
  const t = gap / (-h.vy + c.speed * dy);
  return Math.abs(fold(h.x + h.vx * t) - fold(mx + dx * c.speed * t)) < c.tol;
}
function updateCPU(dt) {
  const c = G.cpu;
  if (c.ammo < c.ammoMax) { c.regen += dt; if (c.regen >= c.regenInt) { c.ammo++; c.regen -= c.regenInt; } } else c.regen = 0;
  // 守り：飛んでくる手に勝ち手を返す
  let target = null;
  for (const h of G.hands) {
    if (h.side !== 'p' || !h.alive) continue;
    if (h.plan === null) { if (G.t - h.born >= c.react) h.plan = Math.random() < c.counterP ? 'c' : 'n'; else continue; }
    if (h.plan === 'c' && (!target || h.y < target.y)) target = h;
  }
  if (target && c.ammo >= 1) {
    const cn = G.Es.find(e => cpuAimed(target, e));
    if (cn) { cpuFire(counterOf(target.t), cn); target.plan = 'd'; }
  }
  // ボスの一斉発射（0.7秒前に予告）
  if (c.boss) {
    c.volT -= dt;
    if (!G.warn && c.volT <= 0.7) { c.volType = Math.random() * 3 | 0; G.warn = 1; SFX.warn(); }
    if (c.volT <= 0) {
      for (let k = 0; k < c.volN; k++) for (const cn of G.Es) c.vq.push({ at: G.t + k * 0.13, cn, t: c.volType });
      c.volT = c.volEvery * (0.85 + Math.random() * 0.3); G.warn = 0;
    }
    c.vq = c.vq.filter(q => { if (q.at <= G.t) { cpuFire(q.t, q.cn, true); return false; } return true; });
  }
  // 攻め
  if (c.burstLeft > 0) {
    c.burstT -= dt;
    if (c.burstT <= 0) { if (cpuFire(c.burstType, c.burstCn)) c.burstLeft--; else c.burstLeft = 0; c.burstT = 0.14; }
  } else {
    c.idleT -= dt;
    if (c.idleT <= 0) {
      if (c.ammo > c.reserve) {
        const t = Math.random() * 3 | 0, cn = G.Es[Math.random() * G.Es.length | 0];
        if (cpuFire(t, cn) && Math.random() < c.burstP) {
          c.burstCn = cn;
          c.burstLeft = 1 + (c.lv >= 3 && Math.random() < 0.5 ? 1 : 0) + (c.lv >= 6 && Math.random() < 0.35 ? 1 : 0);
          c.burstType = t; c.burstT = 0.14;
        }
      }
      c.idleT = c.idle * (0.6 + Math.random() * 0.8);
    }
  }
}

// ================= エフェクト =================
function fxBurst(x, y, col, n = 8, len = 14, life = 0.35) { G.fx.push({ k: 'burst', x, y, col, n, len, t: 0, life, id: ++hid }); }
function fxText(x, y, s, col, size = 22, life = 0.8) { G.fx.push({ k: 'text', x, y, s, col, size, t: 0, life }); }
function fxPuff(x, y) { G.fx.push({ k: 'puff', x, y, t: 0, life: 0.35, id: ++hid }); }

// ================= 更新 =================
function update(dt) {
  G.t += dt; G.stateT += dt; boil = Math.floor(G.t * 7);
  G.swingT += dt;
  G.P.ang = SWING_AMP * Math.sin(G.swingT * Math.PI * 2 / P_PERIOD + G.P.ph);
  for (const cn of G.Es) { cn.ang = SWING_AMP * Math.sin(G.swingT * Math.PI * 2 / cn.per + cn.ph); cn.rec = Math.max(0, cn.rec - dt * 8); }
  G.P.rec = Math.max(0, G.P.rec - dt * 8);
  for (let i = 0; i < 3; i++) G.press[i] = Math.max(0, G.press[i] - dt * 8);
  G.shake = Math.max(0, G.shake - dt); G.flashE = Math.max(0, G.flashE - dt); G.flashP = Math.max(0, G.flashP - dt);
  G.emptyCD -= dt;
  G.hpPs += (G.hpP - G.hpPs) * Math.min(1, dt * 10); G.hpEs += (G.hpE - G.hpEs) * Math.min(1, dt * 10);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.life);

  if (G.state === 'intro') {
    const steps = [0, 0.42, 0.84];
    while (G.introStep < 3 && G.stateT >= steps[G.introStep]) { SFX.jan(G.introStep); G.introStep++; }
    if (G.stateT >= 1.3) setState('play');
  } else if (G.state === 'play') updatePlay(dt);
}
function updatePlay(dt) {
  if (G.ammo < AMMO_MAX) { G.regen += dt; if (G.regen >= P_REGEN) { G.ammo++; G.regen -= P_REGEN; } } else G.regen = 0;
  updateCPU(dt);
  for (const h of G.hands) {
    h.x += h.vx * dt; h.y += h.vy * dt;
    if (h.x < R) { h.x = R; h.vx = Math.abs(h.vx); } else if (h.x > W - R) { h.x = W - R; h.vx = -Math.abs(h.vx); }
  }
  // ぶつかり判定（じゃんけん）
  const ps = G.hands.filter(h => h.side === 'p'), es = G.hands.filter(h => h.side === 'e');
  for (const p of ps) for (const e of es) {
    if (!p.alive || !e.alive) continue;
    const dx = p.x - e.x, dy = p.y - e.y;
    if (dx * dx + dy * dy > (R * 2) ** 2) continue;
    const mx = (p.x + e.x) / 2, my = (p.y + e.y) / 2;
    if (p.t === e.t) { p.alive = e.alive = false; G.stat.d++; fxPuff(mx, my); fxText(mx, my - 18, 'あいこ', GRAY, 14, 0.5); SFX.tie(); }
    else {
      const w = beats(p.t, e.t) ? p : e, l = w === p ? e : p;
      l.alive = false; w.kills++; if (w === p) G.stat.w++; else G.stat.l++;
      fxBurst(l.x, l.y, w.side === 'p' ? BLUE : RED, 8, 14);
      if (w.kills >= 2) fxText(w.x, w.y + (w.side === 'p' ? -26 : 26), '×' + w.kills + '!', w.side === 'p' ? BLUE : RED, 16 + w.kills * 3, 0.7);
      SFX.clash();
    }
  }
  // 陣地に届いたらダメージ
  for (const h of G.hands) {
    if (!h.alive) continue;
    if (h.side === 'p' && h.y - R * 0.6 <= L.eLine) {
      h.alive = false; G.hpE = Math.max(0, G.hpE - DMG); G.flashE = 0.3; G.shake = 0.22;
      fxBurst(h.x, L.eLine, BLUE, 12, 24, 0.45); fxText(h.x, L.eLine + 30, '-' + DMG, RED, 24, 0.8); SFX.hit();
    } else if (h.side === 'e' && h.y + R * 0.6 >= L.pLine) {
      h.alive = false; G.hpP = Math.max(0, G.hpP - DMG); G.flashP = 0.3; G.shake = 0.22;
      fxBurst(h.x, L.pLine, RED, 12, 24, 0.45); fxText(h.x, L.pLine - 30, '-' + DMG, BLUE, 24, 0.8); SFX.hit();
    }
  }
  G.hands = G.hands.filter(h => h.alive && h.y > -40 && h.y < H + 40);
  // 勝敗
  if (G.hpE <= 0) {
    G.streak++;
    if (G.streak > G.best) { G.best = G.streak; G.newBest = true; store.set('jkc_best', G.best); }
    setState('win'); SFX.win();
  } else if (G.hpP <= 0) { setState('lose'); SFX.lose(); }
}

// ================= 描画 =================
function drawPaper() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#dde6f3'; ctx.lineWidth = 1;
  for (let y = 30; y < H; y += 28) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}
function drawCannon(pv, ang, side, rec, id, sc = 1) {
  const col = side === 'p' ? BLUE : RED;
  ctx.save(); ctx.translate(pv.x, pv.y); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.rect(-70, side === 'p' ? -80 : 0, 140, 80); ctx.clip(); // 線の外にはみ出さない
  ctx.rotate(side === 'p' ? ang : Math.PI - ang); ctx.translate(0, rec * 6);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-12.5, -4); ctx.lineTo(-11, -MUZZLE); ctx.lineTo(11, -MUZZLE); ctx.lineTo(12.5, -4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  wline(-12.5, -4, -11, -MUZZLE, id + 1, 0.6); wline(12.5, -4, 11, -MUZZLE, id + 2, 0.6);
  ctx.strokeStyle = col; ctx.lineWidth = 3; wline(-12, -22, 12, -22, id + 4, 0.5);
  ctx.strokeStyle = INK; ctx.lineWidth = 2.4; wcirc(0, -MUZZLE, 11, 4, id + 3, 0.3); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(pv.x, pv.y); ctx.scale(sc, side === 'e' ? -sc : sc);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = col; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, 0, 18 + jit(id, 5, 0.4), Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (sc > 1) { ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, 0); ctx.stroke(); } // ボスは二重丸
  ctx.restore();
}
function drawAim() {
  const a = G.P.ang;
  let x = L.P.x + Math.sin(a) * (MUZZLE + 4), y = L.P.y - Math.cos(a) * (MUZZLE + 4), vx = Math.sin(a), vy = -Math.cos(a), rem = 150, guard = 0;
  ctx.save(); ctx.setLineDash([3, 8]); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(47,85,212,.45)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(x, y);
  while (rem > 0.5 && guard++ < 6) {
    const tx = vx > 0 ? (W - R - x) / vx : vx < 0 ? (R - x) / vx : Infinity;
    const step = Math.max(0, Math.min(rem, tx));
    x += vx * step; y += vy * step; ctx.lineTo(x, y); rem -= step;
    if (step >= tx) vx = -vx;
  }
  ctx.stroke(); ctx.restore();
}
function drawHP(y, hp, col, id, max = HP_MAX, label = 'HP') {
  const x = 46, w = 244, h = 15, fw = w * Math.max(0, hp) / max;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y - h / 2, fw, h); ctx.clip();
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  for (let i = -h; i < fw + h; i += 6) { ctx.beginPath(); ctx.moveTo(x + i, y + h / 2); ctx.lineTo(x + i + h, y - h / 2); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  if (fw > 1 && fw < w - 1) wline(x + fw, y - h / 2, x + fw, y + h / 2, id + 9, 0.4);
  ctx.lineWidth = 2.4; wrect(x, y - h / 2, w, h, id, 0.7);
  text(label, 22, y + 1, label === 'HP' ? 19 : 14, label === 'HP' ? INK : RED);
  text(String(Math.max(0, Math.round(hp))), x + w + 8, y + 1, 13, GRAY, 'left');
}
function drawMute() {
  const { x, y } = L.mute;
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = INK; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-8, -3); ctx.lineTo(-4, -3); ctx.lineTo(1, -8); ctx.lineTo(1, 8); ctx.lineTo(-4, 3); ctx.lineTo(-8, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (muted) { ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(10, 4); ctx.moveTo(10, -4); ctx.lineTo(4, 4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(2, 0, 5, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(2, 0, 9, -0.9, 0.9); ctx.stroke(); }
  ctx.restore();
}
function drawButtons() {
  const off = G.ammo < 1;
  for (const b of L.btn) {
    const sc = 1 - 0.12 * G.press[b.t];
    ctx.save(); ctx.translate(L.btnX, b.y); ctx.scale(sc, sc); ctx.globalAlpha = off ? 0.45 : 1;
    wcirc(0, 0, L.btnR, L.btnR, 300 + b.t, 0.9); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke();
    drawHand(b.t, 0, 2, 0, 0.98, BLUE, 1, 310 + b.t);
    ctx.restore();
    text(NAMES[b.t] + ' →', L.btnX - L.btnR - 6, b.y + 1, 14, INK, 'right', off ? 0.45 : 1);
  }
}
function drawAmmo() {
  const y = L.pLine - 16;
  text('たま', 12, y, 14, INK, 'left');
  const sp = AMMO_MAX > 6 ? 10.5 : 15, pr = AMMO_MAX > 6 ? 4 : 5.5;
  for (let i = 0; i < AMMO_MAX; i++) {
    const x = 50 + i * sp;
    ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.strokeStyle = BLUE; ctx.lineWidth = 1.6; ctx.stroke();
    if (i < G.ammo) { ctx.fillStyle = BLUE; ctx.fill(); }
    else if (i === G.ammo) { ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, pr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (G.regen / P_REGEN)); ctx.closePath(); ctx.fillStyle = 'rgba(47,85,212,.35)'; ctx.fill(); }
  }
}
function drawFX() {
  for (const f of G.fx) {
    const p = f.t / f.life;
    if (f.k === 'burst') {
      ctx.strokeStyle = f.col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.globalAlpha = 1 - p;
      for (let i = 0; i < f.n; i++) {
        const a = i / f.n * Math.PI * 2 + hsh(f.id, i, 0) * 0.3, r0 = 6 + p * f.len * 0.7, r1 = 11 + p * f.len * 1.5;
        ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0); ctx.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (f.k === 'puff') {
      ctx.strokeStyle = GRAY; ctx.lineWidth = 1.8; ctx.globalAlpha = 1 - p;
      for (let i = 0; i < 3; i++) { const a = i * 2.1 + f.id; wcirc(f.x + Math.cos(a) * p * 12, f.y + Math.sin(a) * p * 12, 5 + p * 7, 5 + p * 7, f.id + i, 0.6); ctx.stroke(); }
      ctx.globalAlpha = 1;
    } else if (f.k === 'text') {
      const sc = 1 + 0.5 * Math.max(0, 1 - p * 6);
      ctx.save(); ctx.translate(f.x, f.y - p * 22); ctx.scale(sc, sc);
      text(f.s, 0, 0, f.size, f.col, 'center', p > 0.6 ? (1 - p) / 0.4 : 1); ctx.restore();
    }
  }
}
function overlay(a = 0.78) { ctx.fillStyle = `rgba(251,248,239,${a})`; ctx.fillRect(0, 0, W, H); }
function blink(sp = 3) { return 0.55 + 0.45 * Math.sin(G.t * sp * Math.PI); }
function btnBox(cx, cy, w, h, fill, col, label, tcol, id) {

}
function loseBtns() { const y = H * 0.6; return { share: { x: W / 2, y, w: 220, h: 52 }, retry: { x: W / 2, y: y + 68, w: 220, h: 52 } }; }
const inBox = (b, x, y) => Math.abs(x - b.x) < b.w / 2 && Math.abs(y - b.y) < b.h / 2;

function tapAt(x, y) {
  if (Math.hypot(x - L.mute.x, y - L.mute.y) < 20) { muted = !muted; store.set('jkc_mute', muted); return; }
  switch (G.state) {
    case 'title': startRun(); break;
    case 'play':
      for (const b of L.btn) if (Math.hypot(x - L.btnX, y - b.y) < L.btnR + 10) { playerFire(b.t); break; }
      break;
    case 'win': if (G.stateT > 0.8) startMatch(); break;
    case 'lose':
      if (G.stateT > 0.8) { const b = loseBtns(); if (inBox(b.share, x, y)) share(); else if (inBox(b.retry, x, y)) startRun(); }
      break;
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); tapAt((e.clientX - OX) / S, (e.clientY - OY) / S); });
document.addEventListener('touchend', audioInit, { passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  audioInit();
  const k = e.key.toLowerCase(), m = { '1': 0, 'a': 0, 'j': 0, '2': 1, 's': 1, 'k': 1, '3': 2, 'd': 2, 'l': 2 };
  if (G.state === 'play' && k in m) playerFire(m[k]);
  else if (k === ' ' || k === 'enter') {
    if (G.state === 'title') startRun(); else if (G.state === 'win' && G.stateT > 0.8) startMatch(); else if (G.state === 'lose' && G.stateT > 0.8) startRun();
  }
});

// ================= ループ =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load(`20px Yomogi`).catch(() => { });

// テスト用（遊びには影響しません）
window.__jkc = { G, L, update, playerFire, startRun, startMatch, tapAt };
})();
</script>
